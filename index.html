<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cek DPT Pilkades Air Nyatoh 2026</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome untuk Ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Custom Styling tambahan untuk Print */
    @media print {
      .print\:hidden { display: none !important; }
      .print\:bg-transparent { background-color: transparent !important; }
      .print\:shadow-none { box-shadow: none !important; }

  <!-- React & ReactDOM -->

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Firebase (Compat Version) -->
  <script src="https://www.gstatic.com/firebasejs/10.3.1/firebase-app-compat.js"></script>

</head>
<body class="bg-[#faf8f9] font-sans text-[#252027] antialiased selection:bg-[#c99a3b] selection:text-white">
  
  <div id="root"></div>

  <!-- KODE UTAMA APLIKASI (REACT) -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // ⚠️ KONFIGURASI DATABASE FIREBASE (WAJIB DIISI MILIK ANDA SENDIRI)
    // =========================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyBDcAGi02ZzQ3h9OuBiv6lQ5RSrS0YjgIM",
  authDomain: "cekdptonlinepilkades.firebaseapp.com",
  projectId: "cekdptonlinepilkades",
  storageBucket: "cekdptonlinepilkades.firebasestorage.app",
  messagingSenderId: "638819297097",
  appId: "1:638819297097:web:eb9f04a3c172ed09605c98",
  measurementId: "G-C5C8KCJ7GR"
};

    let app, db;
    try {
      if(firebaseConfig.apiKey && !firebaseConfig.apiKey.includes("GANTI_DENGAN")) {
         app = firebase.initializeApp(firebaseConfig);
         db = firebase.firestore();
         console.log("Firebase Berhasil Diinisialisasi!");
      }
    } catch (e) {
      console.error("Firebase init error", e);
    }
    
    const appId = 'dpt-air-nyatoh-2026'; // ID Koleksi Dokumen

    const maskNik = (nik) => {
      if (!nik || nik.length !== 16) return nik;
      return `****************${nik.slice(-4)}`;
    };

    const getCurrentFormattedDate = () => {
      const options = { day: '2-digit', month: 'long', year: 'numeric' };
      const dateStr = new Date().toLocaleDateString('id-ID', options);
      const timeStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
      return `${dateStr} pukul ${timeStr} WIB`;
    };

    // Wrapper Ikon FontAwesome
    const Icon = ({ cls, size = 16, className = "" }) => <i className={`${cls} ${className}`} style={{ fontSize: size }}></i>;
    const SearchIcon = (p) => <Icon cls="fa-solid fa-search" {...p} />;
    const CheckCircle2 = (p) => <Icon cls="fa-solid fa-circle-check" {...p} />;
    const AlertCircle = (p) => <Icon cls="fa-solid fa-circle-exclamation" {...p} />;
    const Eye = (p) => <Icon cls="fa-solid fa-eye" {...p} />;
    const EyeOff = (p) => <Icon cls="fa-solid fa-eye-slash" {...p} />;
    const ShieldCheck = (p) => <Icon cls="fa-solid fa-shield-halved" {...p} />;
    const ClockIcon = (p) => <Icon cls="fa-solid fa-clock" {...p} />;
    const SmartphoneIcon = (p) => <Icon cls="fa-solid fa-mobile-screen-button" {...p} />;
    const MapPinIcon = (p) => <Icon cls="fa-solid fa-location-dot" {...p} />;
    const UserIcon = (p) => <Icon cls="fa-solid fa-user" {...p} />;
    const CalendarIcon = (p) => <Icon cls="fa-solid fa-calendar-days" {...p} />;
    const PrinterIcon = (p) => <Icon cls="fa-solid fa-print" {...p} />;
    const LogOutIcon = (p) => <Icon cls="fa-solid fa-right-from-bracket" {...p} />;
    const UsersIcon = (p) => <Icon cls="fa-solid fa-users" {...p} />;
    const FileTextIcon = (p) => <Icon cls="fa-solid fa-file-lines" {...p} />;
    const MenuIcon = (p) => <Icon cls="fa-solid fa-bars" {...p} />;
    const XIcon = (p) => <Icon cls="fa-solid fa-xmark" {...p} />;
    const CheckSquareIcon = (p) => <Icon cls="fa-solid fa-square-check" {...p} />;
    const UploadIcon = (p) => <Icon cls="fa-solid fa-upload" {...p} />;
    const InstagramIcon = (p) => <Icon cls="fa-brands fa-instagram" {...p} />;
    const BarChart3Icon = (p) => <Icon cls="fa-solid fa-chart-bar" {...p} />;
    const Trash2Icon = (p) => <Icon cls="fa-solid fa-trash" {...p} />;
    const EditIcon = (p) => <Icon cls="fa-solid fa-pen-to-square" {...p} />;
    const DownloadIcon = (p) => <Icon cls="fa-solid fa-download" {...p} />;

    const LogoResmi = ({ sizeClass }) => (
      <div className={`${sizeClass} flex-shrink-0 bg-white rounded-md p-1 shadow-sm`}>
        <img 
          src="logopptd.png" 
          alt="Logo PPTD Air Nyatoh" 
          className="w-full h-full object-contain"
          onError={(e) => {
            e.target.onerror = null;
            e.target.style.display = 'none';
            e.target.parentElement.innerHTML = `<div class="bg-[#5b1525] text-white w-full h-full rounded-md flex items-center justify-center font-bold text-xs shadow-sm">PPTD</div>`;
          }}
        />
      </div>
    );

    function App() {
      const [currentView, setCurrentView] = useState('public');
      const [database, setDatabase] = useState([]);
      const [isDbLoading, setIsDbLoading] = useState(true);

      // KONEKSI DAN TARIK DATA DARI FIREBASE SECARA REALTIME
      useEffect(() => {
        if (!db) {
           setIsDbLoading(false);
           return;
        }
        
        const docRef = db.collection('data_dpt').doc(appId);
        
        const unsubscribe = docRef.onSnapshot((docSnap) => {
          if (docSnap.exists) {
            try {
              const dataStr = docSnap.data().records;
              if (dataStr) setDatabase(JSON.parse(dataStr));
            } catch (err) { console.error("Gagal parse data", err); }
          }
          setIsDbLoading(false);
        }, (error) => {
           console.error("Error mengambil data:", error);
           alert("GAGAL MENGHUBUNGI DATABASE!\n\nPastikan Firebase Firestore Anda sudah dibuat (Create Database) dan Aturan (Rules) sudah diatur ke 'true'.");
           setIsDbLoading(false);
        });

        return () => unsubscribe();
      }, []);

      // FUNGSI UNTUK MENGIRIM DAN MENYIMPAN DATA KE GOOGLE CLOUD
      const saveToCloud = async (newDatabase) => {
        setDatabase(newDatabase); // Update UI Lokal
        
        if (!db) {
          alert("PERINGATAN: Anda belum memasukkan Kode Firebase di script HTML! Data hanya tersimpan di memori sementara dan akan HILANG jika halaman di-refresh.");
          return;
        }
        
        try {
          await db.collection('data_dpt').doc(appId).set({ 
             records: JSON.stringify(newDatabase),
             lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
          });
          alert("SUKSES: Data berhasil dikirim dan disimpan permanen di Cloud Firebase!");
        } catch (err) {
          console.error("Error menyimpan:", err);
          alert(`GAGAL MENYIMPAN KE CLOUD!\n\nPesan Error: ${err.message}\n\nSolusi: Masuk ke Firebase Console -> Firestore Database -> Buka tab 'Rules' -> Ubah menjadi:\nallow read, write: if true;`);
        }
      };

      return (
        <div className="flex flex-col min-h-screen">
          {currentView === 'public' ? (
            <PublicPortal switchView={() => setCurrentView('admin')} database={database} isDbLoading={isDbLoading} />
          ) : (
            <AdminPortal switchView={() => setCurrentView('public')} database={database} saveToCloud={saveToCloud} db={db} />
          )}
        </div>
      );
    }

    function PublicPortal({ switchView, database, isDbLoading }) {
      const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
      const cekDptRef = useRef(null);
      const chartRef = useRef(null);
      const infoRef = useRef(null);
      const tahapanRef = useRef(null);

      const scrollToSection = (ref) => {
        setIsMobileMenuOpen(false);
        ref.current?.scrollIntoView({ behavior: 'smooth' });
      };

      let genZ = 0, genY = 0, genX = 0, boomers = 0, totalValid = 0;
      if (database.length > 0) {
        database.forEach(u => {
          if(u.nik && u.nik.length === 16) {
             let yearStr = u.nik.substring(10, 12);
             let year = parseInt(yearStr);
             let fullYear = year > 26 ? 1900 + year : 2000 + year; 
             if (fullYear >= 1997 && fullYear <= 2012) genZ++;
             else if (fullYear >= 1981 && fullYear <= 1996) genY++;
             else if (fullYear >= 1965 && fullYear <= 1980) genX++;
             else boomers++; 
             totalValid++;
          }
        });
      }

      const pctZ = totalValid > 0 ? ((genZ / totalValid) * 100).toFixed(1) : "32.7";
      const pctY = totalValid > 0 ? ((genY / totalValid) * 100).toFixed(1) : "32.9";
      const pctX = totalValid > 0 ? ((genX / totalValid) * 100).toFixed(1) : "22.6";
      const pctB = totalValid > 0 ? ((boomers / totalValid) * 100).toFixed(1) : "11.8";

      return (
        <div className="flex flex-col min-h-screen">
          <header className="bg-[#3e0d18] border-b-4 border-[#c99a3b] sticky top-0 z-50 shadow-md print:hidden">
            <div className="container mx-auto px-4 sm:px-6 lg:px-8 max-w-5xl">
              <div className="flex justify-between items-center h-20">
                <div className="flex items-center gap-3">
                  <LogoResmi sizeClass="h-12 w-auto" />
                  <div className="flex flex-col">
                    <span className="text-[10px] sm:text-xs md:text-sm font-bold text-[#c99a3b] uppercase tracking-wider">Panitia Pemilihan Tingkat Desa</span>
                    <span className="text-sm sm:text-base font-extrabold text-white">PILKADES AIR NYATOH 2026</span>
                  </div>
                </div>
                <nav className="hidden md:flex gap-6 items-center">
                  <button onClick={() => window.scrollTo(0, 0)} className="text-sm font-medium text-[#eadde0] hover:text-[#c99a3b] transition-colors">Beranda</button>
                  <button onClick={() => scrollToSection(chartRef)} className="text-sm font-medium text-[#eadde0] hover:text-[#c99a3b] transition-colors">Statistik</button>
                  <button onClick={() => scrollToSection(infoRef)} className="text-sm font-medium text-[#eadde0] hover:text-[#c99a3b] transition-colors">Informasi</button>
                  <a href="https://wa.me/6283157929283" target="_blank" className="text-sm font-medium text-[#eadde0] hover:text-[#c99a3b] transition-colors">Bantuan</a>
                  <button onClick={() => scrollToSection(cekDptRef)} className="bg-[#c99a3b] text-[#3e0d18] px-5 py-2 rounded-xl text-sm font-bold hover:bg-white transition-all shadow-sm border-2 border-[#c99a3b]">CEK DPT</button>
                </nav>
                <button className="md:hidden p-2 text-[#c99a3b]" onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}>
                  {isMobileMenuOpen ? <XIcon size={26} /> : <MenuIcon size={26} />}
                </button>
              </div>
            </div>
            {isMobileMenuOpen && (
              <div className="md:hidden bg-[#3e0d18] border-t border-[#5b1525] px-4 pt-2 pb-4 space-y-1 shadow-lg absolute w-full">
                 <button onClick={() => { window.scrollTo(0,0); setIsMobileMenuOpen(false); }} className="block w-full text-left px-3 py-3 text-base font-medium text-[#eadde0] hover:text-[#c99a3b]">Beranda</button>
                 <button onClick={() => scrollToSection(chartRef)} className="block w-full text-left px-3 py-3 text-base font-medium text-[#eadde0] hover:text-[#c99a3b]">Statistik</button>
                 <button onClick={() => scrollToSection(infoRef)} className="block w-full text-left px-3 py-3 text-base font-medium text-[#eadde0] hover:text-[#c99a3b]">Informasi</button>
                 <button onClick={() => scrollToSection(cekDptRef)} className="block w-full text-center mt-2 bg-[#c99a3b] text-[#3e0d18] px-3 py-3 rounded-xl text-base font-bold">CEK DATA PEMILIH</button>
              </div>
            )}
          </header>

          <main className="flex-grow">
            <div className="text-center mt-12 mb-6 px-4 print:hidden">
               <h1 className="text-3xl md:text-4xl font-extrabold text-[#252027] mb-4 tracking-tight">Selamat Datang di Portal DPT Online</h1>
               <p className="text-[#6e6267] text-base md:text-lg max-w-2xl mx-auto">Portal resmi pengecekan Data Pemilih Tetap (DPT) Pemilihan Kepala Desa Air Nyatoh Tahun 2026.</p>
            </div>

            <section ref={chartRef} className="py-8 print:hidden">
              <div className="container mx-auto px-4 max-w-4xl">
                 <div className="bg-white rounded-2xl p-6 md:p-8 shadow-md border-2 border-[#eadde0] relative overflow-hidden">
                    <div className="absolute top-0 right-0 bg-[#c99a3b] text-[#3e0d18] text-xs font-bold px-3 py-1 rounded-bl-xl shadow-sm">LIVE DATA</div>
                    <div className="flex items-center gap-3 mb-6">
                       <div className="p-3 bg-[#3e0d18] rounded-xl text-[#c99a3b] shadow-sm"><BarChart3Icon size={24} /></div>
                       <div><h2 className="text-xl md:text-2xl font-extrabold text-[#252027]">Statistik Generasi Pemilih</h2><p className="text-[#6e6267] text-sm">Persentase DPT berdasarkan kelompok umur.</p></div>
                    </div>
                    <div className="space-y-2">
                       <div className="group p-3 -mx-3 rounded-xl hover:bg-white hover:shadow-md border border-transparent hover:border-[#eadde0] transition-all cursor-default">
                          <div className="flex justify-between items-end mb-2">
                             <span className="text-[#252027] font-bold group-hover:text-[#c99a3b] transition-all flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-[#c99a3b] opacity-0 group-hover:opacity-100"></span>Gen Y (Milenial)</span>
                             <span className="text-[#c99a3b] font-extrabold text-lg group-hover:scale-110 origin-right transition-transform">{pctY}%</span>
                          </div>
                          <div className="w-full bg-[#faf8f9] rounded-full h-3.5 border border-[#eadde0] overflow-hidden relative"><div className="absolute top-0 left-0 h-full rounded-full transition-all duration-1000 bg-[#c99a3b] group-hover:brightness-110" style={{ width: `${pctY}%` }}></div></div>
                       </div>
                       <div className="group p-3 -mx-3 rounded-xl hover:bg-white hover:shadow-md border border-transparent hover:border-[#eadde0] transition-all cursor-default">
                          <div className="flex justify-between items-end mb-2">
                             <span className="text-[#252027] font-bold group-hover:text-[#5b1525] transition-all flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-[#5b1525] opacity-0 group-hover:opacity-100"></span>Gen Z</span>
                             <span className="text-[#c99a3b] font-extrabold text-lg group-hover:scale-110 origin-right transition-transform">{pctZ}%</span>
                          </div>
                          <div className="w-full bg-[#faf8f9] rounded-full h-3.5 border border-[#eadde0] overflow-hidden relative"><div className="absolute top-0 left-0 h-full rounded-full transition-all duration-1000 bg-[#5b1525] group-hover:brightness-110" style={{ width: `${pctZ}%` }}></div></div>
                       </div>
                       <div className="group p-3 -mx-3 rounded-xl hover:bg-white hover:shadow-md border border-transparent hover:border-[#eadde0] transition-all cursor-default">
                          <div className="flex justify-between items-end mb-2">
                             <span className="text-[#252027] font-bold group-hover:text-[#3e0d18] transition-all flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-[#3e0d18] opacity-0 group-hover:opacity-100"></span>Gen X</span>
                             <span className="text-[#c99a3b] font-extrabold text-lg group-hover:scale-110 origin-right transition-transform">{pctX}%</span>
                          </div>
                          <div className="w-full bg-[#faf8f9] rounded-full h-3.5 border border-[#eadde0] overflow-hidden relative"><div className="absolute top-0 left-0 h-full rounded-full transition-all duration-1000 bg-[#3e0d18] group-hover:brightness-110" style={{ width: `${pctX}%` }}></div></div>
                       </div>
                       <div className="group p-3 -mx-3 rounded-xl hover:bg-white hover:shadow-md border border-transparent hover:border-[#eadde0] transition-all cursor-default">
                          <div className="flex justify-between items-end mb-2">
                             <span className="text-[#252027] font-bold group-hover:text-[#6e6267] transition-all flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-[#6e6267] opacity-0 group-hover:opacity-100"></span>Baby Boomers</span>
                             <span className="text-[#c99a3b] font-extrabold text-lg group-hover:scale-110 origin-right transition-transform">{pctB}%</span>
                          </div>
                          <div className="w-full bg-[#faf8f9] rounded-full h-3.5 border border-[#eadde0] overflow-hidden relative"><div className="absolute top-0 left-0 h-full rounded-full transition-all duration-1000 bg-[#6e6267] group-hover:brightness-110" style={{ width: `${pctB}%` }}></div></div>
                       </div>
                    </div>
                 </div>
              </div>
            </section>

            <section ref={cekDptRef} className="py-8 px-4 print:pt-0 print:pb-0">
              <div className="container mx-auto max-w-3xl">
                <SearchEngine database={database} isDbLoading={isDbLoading} />
              </div>
            </section>

            <section ref={infoRef} className="py-16 bg-white border-y border-[#eadde0] print:hidden">
              <div className="container mx-auto px-4 max-w-5xl">
                <div className="text-center mb-12">
                  <h2 className="text-2xl font-bold text-[#252027] mb-4">Tentang Cek DPT Online</h2>
                  <p className="text-[#6e6267] max-w-2xl mx-auto">Layanan Cek DPT Online merupakan fasilitas informasi yang disediakan untuk membantu masyarakat Desa Air Nyatoh mengetahui status keterdaftarannya.</p>
                </div>
                <div className="grid md:grid-cols-3 gap-6">
                  <div className="bg-[#faf8f9] p-6 rounded-[18px] border border-[#eadde0] shadow-sm text-center">
                    <div className="w-14 h-14 bg-[#5b1525] text-[#c99a3b] rounded-2xl flex items-center justify-center mx-auto mb-4"><SmartphoneIcon size={28} /></div>
                    <h3 className="text-lg font-bold text-[#252027] mb-2">Mudah</h3>
                    <p className="text-[#6e6267] text-sm">Cek data pemilih kapan saja langsung dari smartphone Anda.</p>
                  </div>
                  <div className="bg-[#faf8f9] p-6 rounded-[18px] border border-[#eadde0] shadow-sm text-center">
                    <div className="w-14 h-14 bg-[#5b1525] text-[#c99a3b] rounded-2xl flex items-center justify-center mx-auto mb-4"><ClockIcon size={28} /></div>
                    <h3 className="text-lg font-bold text-[#252027] mb-2">Cepat</h3>
                    <p className="text-[#6e6267] text-sm">Informasi status pemilih ditampilkan secara instan.</p>
                  </div>
                  <div className="bg-[#faf8f9] p-6 rounded-[18px] border border-[#eadde0] shadow-sm text-center">
                    <div className="w-14 h-14 bg-[#5b1525] text-[#c99a3b] rounded-2xl flex items-center justify-center mx-auto mb-4"><ShieldCheck size={28} /></div>
                    <h3 className="text-lg font-bold text-[#252027] mb-2">Aman</h3>
                    <p className="text-[#6e6267] text-sm">Data pribadi Anda dijaga kerahasiaannya untuk verifikasi DPT.</p>
                  </div>
                </div>
              </div>
            </section>
          </main>

          <footer className="bg-[#3e0d18] border-t-4 border-[#c99a3b] text-white py-12 print:hidden">
            <div className="container mx-auto px-4 max-w-5xl text-center">
              <div className="flex justify-center mb-6"><LogoResmi sizeClass="h-16 md:h-20 w-auto" /></div>
              <h3 className="text-[#c99a3b] font-bold text-lg mb-1 tracking-wide">PANITIA PEMILIHAN TINGKAT DESA</h3>
              <p className="text-[#eadde0] text-sm mb-8">Pemilihan Kepala Desa Air Nyatoh Tahun 2026</p>
              <div className="pt-6 border-t border-[#5b1525] flex flex-col md:flex-row justify-between items-center gap-4 text-xs text-[#eadde0]">
                <p>© 2026 Panitia Pemilihan Tingkat Desa Air Nyatoh.</p>
                <button onClick={switchView} className="flex items-center gap-1 hover:text-[#c99a3b] opacity-60 hover:opacity-100 transition-colors"><ShieldCheck size={14} /> Login Admin</button>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    function SearchEngine({ database, isDbLoading }) {
      const [nik, setNik] = useState('');
      const [showNik, setShowNik] = useState(false);
      const [isAgreed, setIsAgreed] = useState(false);
      const [status, setStatus] = useState('idle'); 
      const [errorMsg, setErrorMsg] = useState('');
      const [resultData, setResultData] = useState(null);

      const handleSearch = (e) => {
        e.preventDefault();
        if (!nik) return setErrorMsg('Silakan masukkan NIK terlebih dahulu.');
        if (nik.length !== 16) return setErrorMsg('Nomor NIK harus terdiri dari 16 digit.');
        if (!isAgreed) return setErrorMsg('Anda harus menyetujui penggunaan data untuk melanjutkan.');

        setStatus('loading');
        setErrorMsg(''); setResultData(null);

        setTimeout(() => {
          const found = database.find(d => d.nik === nik);
          if (found) { setResultData({ ...found, checkTime: getCurrentFormattedDate() }); setStatus('success'); } 
          else { setStatus('not-found'); }
        }, 1200);
      };

      return (
        <div className="w-full">
          <div className={`bg-white rounded-[18px] shadow-lg border-2 border-[#eadde0] p-6 md:p-8 max-w-2xl mx-auto transition-all ${status === 'success' ? 'print:hidden hidden' : 'block'}`}>
            <form onSubmit={handleSearch}>
              <div className="mb-6">
                <label className="block text-sm font-bold text-[#252027] mb-2 flex items-center gap-2"><SearchIcon size={18} className="text-[#c99a3b]" /> Cek Status Pemilih (NIK)</label>
                <div className="relative">
                  <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"><UserIcon className="text-[#c99a3b]" size={20} /></div>
                  <input type={showNik ? "text" : "password"} value={nik} onChange={(e) => setNik(e.target.value.replace(/\D/g, '').slice(0, 16))} placeholder="Masukkan 16 digit NIK" className={`w-full pl-12 pr-12 py-4 bg-[#faf8f9] border-2 border-[#c99a3b] rounded-xl text-base font-bold focus:outline-none focus:ring-[#5b1525] text-[#252027]`} />
                  <button type="button" onClick={() => setShowNik(!showNik)} className="absolute inset-y-0 right-0 pr-4 flex items-center text-[#c99a3b] hover:text-[#5b1525]">{showNik ? <EyeOff size={22} /> : <Eye size={22} />}</button>
                </div>
                {errorMsg && <p className="mt-2 text-sm text-red-600 flex items-center gap-1 font-medium"><AlertCircle size={16} /> {errorMsg}</p>}
              </div>
              <div className="mb-8">
                <label className="flex items-start gap-3 cursor-pointer group">
                  <div className="relative flex items-center mt-0.5">
                    <input type="checkbox" checked={isAgreed} onChange={(e) => setIsAgreed(e.target.checked)} className="peer w-5 h-5 appearance-none border-2 border-[#eadde0] rounded bg-white checked:bg-[#5b1525] focus:outline-none focus:ring-2 focus:ring-[#5b1525] transition-all cursor-pointer"/>
                    <CheckSquareIcon size={16} className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 text-white opacity-0 peer-checked:opacity-100 pointer-events-none" />
                  </div>
                  <span className="text-sm text-[#6e6267] group-hover:text-[#252027]">Saya menyetujui penggunaan data ini hanya untuk keperluan pengecekan daftar pemilih Pilkades Air Nyatoh 2026.</span>
                </label>
              </div>
              <button type="submit" disabled={status === 'loading'} className="w-full bg-[#5b1525] text-white py-4 rounded-xl font-bold text-lg hover:bg-[#3e0d18] active:scale-[0.99] transition-all shadow-md disabled:opacity-70 flex justify-center items-center gap-2">
                {status === 'loading' ? "Memeriksa data..." : isDbLoading ? "Menyiapkan Database..." : "CEK DATA PEMILIH"}
              </button>
            </form>
          </div>

          {status === 'success' && resultData && (
            <div className="w-full max-w-2xl mx-auto print:max-w-none print:w-full print:m-0">
              <div className="bg-white rounded-[18px] shadow-sm border border-[#eadde0] overflow-hidden print:shadow-none print:border-0">
                <div className="hidden print:block text-center pt-8 pb-4 border-b border-[#eadde0] mb-4">
                   <h2 className="text-2xl font-extrabold text-[#252027] uppercase">TANDA BUKTI TERDAFTAR</h2><p className="text-sm font-bold text-[#c99a3b] uppercase">Pilkades Air Nyatoh 2026</p>
                </div>
                <div className="p-6 md:p-8 print:p-2">
                  <div className="bg-green-50 border border-green-200 rounded-xl p-4 mb-8 text-center print:bg-white print:border-2 print:border-green-600 print:text-left">
                    <h3 className="text-green-800 font-bold text-lg md:text-xl">SELAMAT, {resultData.nama}</h3>
                    <p className="text-green-700 text-sm mt-1">Anda telah terdaftar sebagai pemilih.</p>
                  </div>
                  <div className="space-y-4 print:space-y-2">
                    <InfoRow icon={<UserIcon />} label="Nama Lengkap" value={resultData.nama} isBold />
                    <InfoRow icon={<ShieldCheck />} label="Status" value={<span className="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-xs font-bold bg-green-100 text-green-800 print:bg-transparent print:p-0 print:text-green-700"><CheckCircle2 size={14} className="print:hidden"/> {resultData.status || "TERDAFTAR"}</span>} />
                    <InfoRow icon={<MapPinIcon />} label="Wilayah" value="AIR NYATOH, BANGKA BARAT" />
                    <InfoRow icon={<MapPinIcon className="opacity-0 print:hidden"/>} label="Dusun" value={resultData.dusun} />
                    <InfoRow icon={<MapPinIcon className="opacity-0 print:hidden"/>} label="TPS" value={<span className="font-extrabold text-[#5b1525] text-lg">{resultData.tps}</span>} />
                    <InfoRow icon={<FileTextIcon />} label="Nomor DPT" value={resultData.nomor_dpt} />
                    <InfoRow icon={<CalendarIcon />} label="Waktu Pengecekan" value={resultData.checkTime} />
                  </div>
                </div>
                <div className="bg-[#faf8f9] p-6 border-t border-[#eadde0] text-center print:hidden flex justify-center gap-3">
                   <button onClick={() => window.print()} className="px-6 py-3 bg-[#252027] text-white font-bold rounded-xl hover:bg-black"><PrinterIcon size={18} className="mr-2"/> Cetak Bukti</button>
                   <button onClick={() => {setStatus('idle'); setNik(''); setIsAgreed(false);}} className="px-6 py-3 bg-white text-[#252027] font-bold rounded-xl border border-[#eadde0]">Kembali</button>
                </div>
              </div>
            </div>
          )}

          {status === 'not-found' && (
        <div className="animate-in fade-in slide-in-from-bottom-4 duration-500 w-full max-w-2xl mx-auto">
           <div className="bg-white rounded-[18px] shadow-sm border border-red-200 overflow-hidden text-center p-8">
              <div className="w-20 h-20 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-6"><AlertCircle size={40} /></div>
              <h3 className="text-2xl font-bold text-[#252027] mb-2">DATA TIDAK DITEMUKAN</h3>
              <p className="text-[#6e6267] mb-6 max-w-md mx-auto">Maaf, data pemilih dengan NIK <span className="font-mono bg-[#faf8f9] px-1 rounded font-bold">{maskNik(nik)}</span> tidak ditemukan.</p>
              <div className="flex flex-col sm:flex-row gap-4 justify-center">
                 <button onClick={handleReset} className="px-6 py-3 bg-white text-[#252027] font-bold rounded-xl border border-[#eadde0] hover:bg-[#faf8f9] transition-colors">Coba Lagi</button>
                 <a href="https://wa.me/6283157929283" target="_blank" rel="noopener noreferrer" className="flex justify-center items-center px-6 py-3 bg-[#5b1525] text-white font-bold rounded-xl hover:bg-[#3e0d18] transition-colors">Hubungi Panitia</a>
              </div>
           </div>
        </div>
      )}
    </div>
  );
}
    
    function InfoRow({ icon, label, value, isBold = false }) {
      return (
        <div className="flex flex-col sm:flex-row sm:items-center py-2 border-b border-[#eadde0]/50 print:border-b print:border-gray-300 print:py-1">
          <div className="sm:w-1/3 flex items-center gap-2 text-sm text-[#6e6267] mb-1 sm:mb-0 print:text-black print:font-semibold"><span className="text-[#c99a3b] print:hidden">{icon}</span> {label}</div>
          <div className={`sm:w-2/3 text-sm md:text-base ${isBold ? 'font-bold text-[#252027]' : 'font-medium text-[#252027]'} print:text-black`}><span className="hidden sm:inline-block mr-2 print:inline-block">:</span> {value}</div>
        </div>
      );
    }

    function AdminPortal({ switchView, database, saveToCloud, db }) {
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [username, setUsername] = useState('');
      const [password, setPassword] = useState('');
      const [searchTerm, setSearchTerm] = useState('');
      const fileInputRef = useRef(null);

      const handleLogin = (e) => {
        e.preventDefault();
        if (username === 'admin' && password === '31072026') setIsLoggedIn(true);
        else alert("Username atau password salah!");
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          let text = event.target.result;
          if (text.charCodeAt(0) === 0xFEFF) text = text.substr(1);
          const rows = text.split('\n');
          const delimiter = rows[0].includes(';') ? ';' : ',';
          const headers = rows[0].toUpperCase().split(delimiter).map(h => h.trim().replace(/"/g, ''));
          const idxNik = headers.findIndex(h => h.includes('NIK'));
          const idxNama = headers.findIndex(h => h.includes('NAMA'));
          const idxJK = headers.findIndex(h => h.includes('JENIS KELAMIN') || h.includes('L/P'));
          const idxTPS = headers.findIndex(h => h.includes('TPS'));

          let newData = [];
          for (let i = 1; i < rows.length; i++) {
            if (!rows[i].trim()) continue;
            const row = rows[i].split(delimiter).map(col => col.trim().replace(/"/g, ''));
            const nikVal = row[idxNik]?.replace(/\D/g, ''); 
            if (nikVal && nikVal.length === 16) {
               if (!database.some(d => d.nik === nikVal) && !newData.some(d => d.nik === nikVal)) {
                 let jkVal = idxJK !== -1 ? row[idxJK].toUpperCase() : "-";
                 if (jkVal.includes('L') || jkVal.includes('LAKI')) jkVal = 'Laki-laki';
                 if (jkVal.includes('P') || jkVal.includes('PEREMPUAN')) jkVal = 'Perempuan';
                 let tpsVal = idxTPS !== -1 ? row[idxTPS] : "01";
                 if (!tpsVal.toUpperCase().includes('TPS')) tpsVal = `TPS ${tpsVal.padStart(2, '0')}`;
                 newData.push({ id: Date.now() + i, nik: nikVal, nama: row[idxNama], jenis_kelamin: jkVal, dusun: "Air Nyatoh", tps: tpsVal, nomor_dpt: `DPT-2026-${String(database.length + newData.length + 1).padStart(4, '0')}`, status: "TERDAFTAR" });
               }
            }
          }
          if (newData.length > 0) { 
            saveToCloud([...database, ...newData]); 
          }
          fileInputRef.current.value = "";
        };
        reader.readAsText(file);
      };

      const filteredData = database.filter(item => item.nik.includes(searchTerm) || item.nama.toLowerCase().includes(searchTerm.toLowerCase())).slice(0, 50);

      const stats = {
        total: database.length,
        laki: database.filter(d => {
           const jk = d.jenis_kelamin?.toUpperCase() || "";
           return jk === 'LAKI-LAKI' || jk === 'L' || jk.includes('LAKI');
        }).length,
        perempuan: database.filter(d => {
           const jk = d.jenis_kelamin?.toUpperCase() || "";
           return jk === 'PEREMPUAN' || jk === 'P' || jk.includes('PEREMPUAN');
        }).length,
      };

      if (!isLoggedIn) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-[#faf8f9]">
            <form onSubmit={handleLogin} className="bg-white p-8 rounded-xl shadow-md border max-w-sm w-full relative">
              <div className="absolute top-4 right-4 flex items-center gap-1.5 text-xs font-bold">
                 {db ? <span className="text-green-600 flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-green-500 animate-pulse"></div> Cloud Aktif</span> : <span className="text-red-500 flex items-center gap-1"><div className="w-2 h-2 rounded-full bg-red-500"></div> Cloud Offline</span>}
              </div>
              <h2 className="text-2xl font-bold mb-6 text-center mt-2">Login Admin</h2>
              <input type="text" placeholder="Username" value={username} onChange={e=>setUsername(e.target.value)} className="w-full mb-3 p-3 border rounded" />
              <input type="password" placeholder="Password" value={password} onChange={e=>setPassword(e.target.value)} className="w-full mb-6 p-3 border rounded" />
              <button type="submit" className="w-full bg-[#5b1525] text-white p-3 rounded font-bold">Masuk</button>
              <button type="button" onClick={switchView} className="w-full mt-4 text-sm text-gray-500 hover:text-gray-800">Kembali</button>
            </form>
          </div>
        );
      }

      return (
        <div className="p-6 bg-[#faf8f9] min-h-screen">
          <div className="max-w-6xl mx-auto">
            <div className="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
              <div>
                <h1 className="text-2xl font-bold flex items-center gap-2">
                   Dashboard Admin
                   {db ? <span className="text-xs bg-green-100 text-green-800 px-2 py-1 rounded-full font-bold shadow-sm">Cloud Tersambung</span> : <span className="text-xs bg-red-100 text-red-800 px-2 py-1 rounded-full font-bold shadow-sm animate-pulse">Mode Offline (Peringatan!)</span>}
                </h1>
              </div>
              <div className="flex gap-2">
                <input type="file" accept=".csv" className="hidden" ref={fileInputRef} onChange={handleFileUpload} />
                <button onClick={() => fileInputRef.current?.click()} className="bg-green-600 text-white px-4 py-2 rounded font-bold"><UploadIcon className="mr-2"/> Import CSV</button>
                <button onClick={() => { if(window.confirm('HAPUS SEMUA DATA?')) { saveToCloud([]); } }} className="bg-red-600 text-white px-4 py-2 rounded font-bold"><Trash2Icon className="mr-2"/> Reset</button>
                <button onClick={() => setIsLoggedIn(false)} className="bg-gray-800 text-white px-4 py-2 rounded font-bold">Logout</button>
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#eadde0]">
                <div className="flex justify-between items-start">
                  <div><p className="text-sm text-[#6e6267] font-bold mb-1">Total DPT</p><p className="text-3xl font-extrabold text-[#5b1525]">{stats.total}</p></div>
                  <div className="p-3 bg-[#faf8f9] text-[#c99a3b] rounded-xl"><UsersIcon size={24}/></div>
                </div>
              </div>
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#eadde0]">
                <div className="flex justify-between items-start">
                  <div><p className="text-sm text-[#6e6267] font-bold mb-1">Laki-laki</p><p className="text-3xl font-extrabold text-[#252027]">{stats.laki}</p></div>
                  <div className="p-3 bg-[#faf8f9] text-[#c99a3b] rounded-xl"><UserIcon size={24}/></div>
                </div>
              </div>
              <div className="bg-white p-5 rounded-2xl shadow-sm border border-[#eadde0]">
                <div className="flex justify-between items-start">
                  <div><p className="text-sm text-[#6e6267] font-bold mb-1">Perempuan</p><p className="text-3xl font-extrabold text-[#252027]">{stats.perempuan}</p></div>
                  <div className="p-3 bg-[#faf8f9] text-[#c99a3b] rounded-xl"><UserIcon size={24}/></div>
                </div>
              </div>
            </div>
            
            <div className="bg-white p-6 rounded-xl shadow-sm border">
               <input type="text" placeholder="Cari NIK / Nama..." value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} className="w-full p-3 border rounded mb-4"/>
               <p className="text-sm text-gray-500 mb-2">Menampilkan max 50 data terbaru dari total {database.length} pemilih.</p>
               <div className="overflow-x-auto">
                 <table className="w-full text-left border-collapse">
                   <thead><tr className="border-b bg-gray-50">
                     <th className="p-3">NIK</th><th className="p-3">Nama</th><th className="p-3">L/P</th><th className="p-3">TPS</th><th className="p-3">Aksi</th>
                   </tr></thead>
                   <tbody>
                     {filteredData.map(row => (
                       <tr key={row.id} className="border-b hover:bg-gray-50">
                         <td className="p-3 font-mono">{row.nik}</td><td className="p-3 font-bold">{row.nama}</td><td className="p-3">{row.jenis_kelamin === 'Laki-laki' || row.jenis_kelamin === 'L' ? 'L' : 'P'}</td><td className="p-3">{row.tps}</td>
                         <td className="p-3"><button onClick={() => { if(window.confirm('Hapus?')) saveToCloud(database.filter(d => d.id !== row.id)) }} className="text-red-500"><Trash2Icon size={16}/></button></td>
                       </tr>
                     ))}
                   </tbody>
                 </table>
               </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
